<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D9488">
<title>RxOne Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0D9488;--p50:#ecfdf8;--bg:#f4f5f7;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 10px;font:inherit}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.muted{color:var(--mu);font-size:14px}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mu)}
input,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.btn{display:block;width:100%;font:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:14px;border:0;background:var(--p);color:#fff;margin-top:12px}
.btn.light{background:#eef0f3;color:var(--tx)}
.btn.danger{background:#fee2e2;color:var(--er)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:18px 12px;text-align:center;border:1px solid var(--bd);font-weight:600}
.tile .ic{font-size:30px;display:block;margin-bottom:6px}
#cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .frame{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--p50);color:var(--p);font-size:13px;font-weight:600}
.pill.er{background:#fee2e2;color:var(--er)}.pill.wa{background:#fef3c7;color:#92400e}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.row:last-child{border-bottom:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:#111827;color:#fff;border-radius:14px;padding:12px 14px;display:none;z-index:20}
#toast.ok{background:var(--ok)}#toast.er{background:var(--er)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:15}
.sheet>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1 id="hTitle">RxOne Scanner</h1><button id="hBack" class="hidden">กลับ</button><button id="hOut" class="hidden">ออก</button></header>
<main id="app"></main>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
